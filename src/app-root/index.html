<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Integrated Work Environment</title>
    <!-- Installable from Safari (Add to Dock) and Chrome (Install page as app). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Relative: the build (src/app-root/client.ts) rewrites the script to the bundle it
         makes, and the icons to the /icons route the server already serves. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#14161a" />
    <meta name="apple-mobile-web-app-title" content="IWE" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Out-of-tree extension clients import react and its jsx runtimes through this map,
         landing on the vendor chunks the server builds from the app's own react — the page's
         bundle and a served chunk must be one react, because two break hooks and context.
         The page's own imports are resolved by the bundler and never consult the map. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react/jsx-runtime": "/vendor/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "/vendor/react-jsx-runtime.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
