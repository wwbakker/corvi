name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch makes an older run's answer irrelevant; main's own runs are allowed
# to finish, so its status never describes a commit someone has replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Fast, and separate from the tests on purpose: a flaky test must not hide a type error, and
    # a rerun of this job costs a minute rather than the whole suite.
    runs-on: ubuntu-latest
    # The job takes a couple of minutes; five is the budget before a hang is a failure.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run boundaries

  test:
    # Everything that needs no browser: unit and integration tests.
    runs-on: ubuntu-latest
    # The suite takes a couple of minutes; five is the budget before a hang is a failure.
    timeout-minutes: 5
    env:
      # One test process: a worker whose teardown stalls has hung this job, and a hang here is the
      # five-minute timeout, so the files run one at a time instead.
      CORVI_TEST_SERIAL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  e2e:
    # The non-terminal browser end-to-end files on their own, one file at a time: they are the
    # most timing-sensitive part of the suite, so they get generous wait budgets
    # (CORVI_TEST_WAIT_SCALE scales every wait deadline and test timeout) and one bounded
    # retry — a test that passes on retry still reads as a flake in the log, but it is not a
    # red build. What a failed test saw is left in test-artifacts/ and uploaded below. The
    # sibling below runs the terminal files; both must be required status checks in branch
    # protection, or a terminal-only failure will not block a merge.
    runs-on: ubuntu-latest
    # More than the jobs above — retries and scaled waits — but still a budget before a hang
    # is a failure: one pass of the non-terminal group takes a couple of minutes.
    timeout-minutes: 20
    env:
      CORVI_TEST_WAIT_SCALE: "3"
      CORVI_TEST_ARTIFACTS: test-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/test-run.sh e2e-rest --retry=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-screenshots
          path: test-artifacts/
          if-no-files-found: ignore

  e2e-terminal:
    # The terminal browser end-to-end files (test/terminal*.test.ts) on their own. Same setup,
    # waits and retry as `e2e`, and its own artifact name — upload-artifact@v4 rejects a
    # duplicate name within a single run. It must be a required status check alongside `e2e`
    # in branch protection, or a terminal-only failure will not block a merge.
    runs-on: ubuntu-latest
    # More than the jobs above — retries and scaled waits — but still a budget before a hang
    # is a failure: one pass of the terminal group takes a couple of minutes.
    timeout-minutes: 20
    env:
      CORVI_TEST_WAIT_SCALE: "3"
      CORVI_TEST_ARTIFACTS: test-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/test-run.sh e2e-terminal --retry=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-terminal-failure-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
