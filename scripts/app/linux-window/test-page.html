<!doctype html>
<!-- A trivial page for exercising the window without the IWE server:
     serve this directory (python3 -m http.server 43117) and launch
     iwe-window.py. Checks the capabilities the macOS WKWebView app needed. -->
<html>
<head>
<meta charset="utf-8">
<title>IWE window test</title>
<style>
  body { margin:0; height:100vh; display:flex; gap:12px; flex-direction:column;
         align-items:center; justify-content:center; background:#14161a;
         color:#8b93a1; font:14px ui-sans-serif,system-ui,sans-serif; }
  button { background:#232730; color:#d7dde6; border:1px solid #333a46;
           padding:8px 14px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
  <div id="title">window title follows this document.title</div>
  <button onclick="alert('alert works')">alert()</button>
  <button onclick="document.getElementById('title').textContent =
    'confirm returned ' + window.confirm('confirm works?')">confirm()</button>
  <button onclick="document.getElementById('title').textContent =
    'prompt returned ' + (window.prompt('prompt works?', 'default') ?? 'null')">prompt()</button>
  <button onclick="navigator.clipboard.writeText('from IWE window').then(() =>
    document.getElementById('title').textContent = 'clipboard write ok').catch(e =>
    document.getElementById('title').textContent = 'clipboard write failed: ' + e)">
    clipboard.writeText()</button>
  <button onclick="navigator.mediaDevices.getUserMedia({audio:true}).then(s => {
    document.getElementById('title').textContent = 'microphone ok';
    s.getTracks().forEach(t => t.stop()); }).catch(e =>
    document.getElementById('title').textContent = 'microphone failed: ' + e)">
    getUserMedia({audio:true})</button>
  <script>
    // WebSocket over the same origin (what the terminal iframes use):
    // this page reports whether the constructor at least connects/handshakes.
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => document.getElementById('title').textContent = 'websocket open';
    ws.onerror = () => {}; // server here has no /ws endpoint; constructor is the test
  </script>
  <script>
    // ?autotest runs the capability checks without a human and reports via
    // document.title (visible in hyprctl clients), then opens a confirm()
    // so a screenshot shows the window's script dialog.
    if (location.search.includes('autotest')) {
      const results = {};
      const report = () => { document.title = 'AUTO ' + Object.entries(results)
        .map(([k, v]) => k + '=' + v).join(' '); };
      const attempt = (name, fn) => { try { fn(); } catch (e) { results[name] = 'throw:' + e.message.slice(0, 60); } report(); };
      attempt('mediaDevices', () => { results.mediaDevices = typeof navigator.mediaDevices; });
      attempt('clipboard', () => { results.clipboardApi = typeof navigator.clipboard; });
      attempt('webgl', () => {
        const gl = document.createElement('canvas').getContext('webgl2')
          || document.createElement('canvas').getContext('webgl');
        results.webgl = gl ? 'ok' : 'missing';
      });
      const ws2 = new WebSocket(`ws://${location.host}/ws`);
      let wsDone = false;
      ws2.onopen = () => { wsDone = true; results.websocket = 'open'; report(); };
      setTimeout(() => { if (!wsDone) { results.websocket = 'handshake-failed'; report(); } }, 2000);
      attempt('microphone', () => {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(s => { results.microphone = 'ok';
            s.getTracks().forEach(t => t.stop()); report(); })
          .catch(e => { results.microphone = 'fail:' + e.name; report(); });
      });
      attempt('clipboardWrite', () => {
        navigator.clipboard.writeText('from IWE window autotest')
          .then(() => { results.clipboardWrite = 'ok'; report(); })
          .catch(e => { results.clipboardWrite = 'fail:' + e.name; report(); });
      });
      attempt('clipboardRead', () => {
        navigator.clipboard.readText()
          .then(() => { results.clipboardRead = 'ok'; report(); })
          .catch(e => { results.clipboardRead = 'fail:' + e.name; report(); });
      });
      setTimeout(() => window.confirm('dialog test: confirm() reached the window'), 5000);
    }
  </script>
</body>
</html>
